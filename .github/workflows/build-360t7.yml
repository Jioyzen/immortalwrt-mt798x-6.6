name: Build and release 360T7 firmware

on:
  push:
    branches:
      - 360t7-clean
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 360t7-cloud-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/360t7-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ccache ecj fastjar file g++ gawk gettext \
            git java-propose-classpath libelf-dev libncurses-dev libncursesw5-dev \
            libssl-dev python3 python3-dev python3-setuptools rsync swig time unzip zlib1g-dev

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure 360T7 profile
        run: |
          cp defconfig/qihoo-360t7-clean.config .config
          make defconfig
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7=y$' .config
          grep -E '^CONFIG_PACKAGE_(kmod-mt_wifi|ppp-mod-pppoe|odhcp6c|luci-theme-argon)=y$' .config

      - name: Download source archives
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: make -j"$(nproc)" V=s

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          target=bin/targets/mediatek/filogic
          assets=release-assets
          mkdir -p "$assets"
          cp "$target/immortalwrt-mediatek-filogic-qihoo_360t7-squashfs-sysupgrade.bin" "$assets/"
          cp "$target/immortalwrt-mediatek-filogic-qihoo_360t7-initramfs-kernel.bin" "$assets/"
          cp "$target/immortalwrt-mediatek-filogic.manifest" "$assets/"
          cp "$target/config.buildinfo" "$assets/"
          printf '%s\n' "$(git rev-parse HEAD)" > "$assets/SOURCE_COMMIT"
          (cd "$assets" && sha256sum * > SHA256SUMS)
          ls -lh "$assets"

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 360t7-firmware-${{ github.run_number }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="360t7-$(date -u +'%Y%m%d-%H%M%S')-run${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "360T7 firmware build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated 360T7 build from commit $(git rev-parse --short HEAD) on branch ${GITHUB_REF_NAME}. Built with defconfig/qihoo-360t7-clean.config."
